<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <pattern id="qrGrid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#E8F1EC" />
      <rect x="8" y="8" width="8" height="8" fill="#E8F1EC" />
    </pattern>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="320" rx="16" fill="#FAF8F1" stroke="#205C46" stroke-width="2" />
  
  <!-- Inner QR Area Pattern -->
  <rect x="25" y="25" width="270" height="270" rx="12" fill="#FFFFFF" stroke="#DFD9CC" stroke-width="1.5" />
  <rect x="35" y="35" width="250" height="250" fill="url(#qrGrid)" opacity="0.6" />

  <!-- Corner Alignment Targets (Simulated QR Corners) -->
  <!-- Top Left -->
  <rect x="45" y="45" width="55" height="55" rx="8" fill="none" stroke="#205C46" stroke-width="6" />
  <rect x="60" y="60" width="25" height="25" rx="4" fill="#205C46" />

  <!-- Top Right -->
  <rect x="220" y="45" width="55" height="55" rx="8" fill="none" stroke="#205C46" stroke-width="6" />
  <rect x="235" y="60" width="25" height="25" rx="4" fill="#205C46" />

  <!-- Bottom Left -->
  <rect x="45" y="220" width="55" height="55" rx="8" fill="none" stroke="#205C46" stroke-width="6" />
  <rect x="60" y="235" width="25" height="25" rx="4" fill="#205C46" />

  <!-- Center Watermark & Warning Badge -->
  <g transform="translate(160, 160)">
    <!-- Shield / Alert Background -->
    <rect x="-115" y="-45" width="230" height="90" rx="10" fill="#FEF3D6" stroke="#C59635" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.08))" />
    
    <!-- Lock / Warning Icon -->
    <circle cx="0" cy="-18" r="14" fill="#C59635" />
    <path d="M-4 -16 H4 V-10 H-4 Z M-2 -16 V-20 C-2 -22 2 -22 2 -20 V-16" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />
    
    <!-- Explanatory Text -->
    <text x="0" y="6" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" fill="#784A04" letter-spacing="0.5">PREVIEW PLACEHOLDER</text>
    <text x="0" y="22" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#946312">OFFICIAL QR PENDING VERIFICATION</text>
    <text x="0" y="34" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="500" fill="#A87522">DO NOT SCAN • FOR DISPLAY DEMO ONLY</text>
  </g>

  <!-- Top and Bottom Instruction Bands -->
  <rect x="25" y="25" width="270" height="22" rx="6" fill="#205C46" />
  <text x="160" y="40" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">LAKSHYA WELFARE SOCIETY • PILIBHIT</text>

  <rect x="25" y="273" width="270" height="22" rx="6" fill="#153E2F" />
  <text x="160" y="288" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8.5" font-weight="600" fill="#D3E8DF">Verify payee name before transfer</text>
</svg>
