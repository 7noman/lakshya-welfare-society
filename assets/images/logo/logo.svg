<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#205C46" />
      <stop offset="100%" stop-color="#153E2F" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBD6A" />
      <stop offset="100%" stop-color="#C59635" />
    </linearGradient>
  </defs>
  
  <!-- Emblem Icon -->
  <g transform="translate(10, 10)">
    <!-- Base rounded shield/leaf -->
    <rect x="0" y="0" width="80" height="80" rx="18" fill="url(#brandGrad)" />
    
    <!-- Community Tree / Protective Hands Motif -->
    <!-- Tree Trunk / Stem -->
    <path d="M40 70 V38" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    
    <!-- Left Leaf -->
    <path d="M40 52 C30 52 24 44 26 34 C36 34 40 44 40 52 Z" fill="#4AA493" />
    
    <!-- Right Leaf -->
    <path d="M40 44 C50 44 56 36 54 26 C44 26 40 36 40 44 Z" fill="url(#goldGrad)" />
    
    <!-- Central Rising Sun / Goal Motif (Lakshya) -->
    <circle cx="40" cy="24" r="8" fill="#FFFFFF" />
    <circle cx="40" cy="24" r="4.5" fill="url(#goldGrad)" />
    
    <!-- Ground / Root Base -->
    <path d="M28 70 C36 67 44 67 52 70" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  </g>
  
  <!-- Typography -->
  <text x="105" y="44" font-family="'Lora', Georgia, serif" font-size="24" font-weight="700" fill="#123326" letter-spacing="-0.3">Lakshya</text>
  <text x="202" y="44" font-family="'Lora', Georgia, serif" font-size="24" font-weight="400" fill="#205C46">Welfare Society</text>
  
  <!-- Sub-label -->
  <text x="106" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" fill="#53635D" letter-spacing="1.2">CHANDOI, PILIBHIT, UTTAR PRADESH</text>
  
  <!-- Subtle accent divider -->
  <rect x="106" y="74" width="70" height="2.5" rx="1" fill="#C59635" />
</svg>
