<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F4F0" />
      <stop offset="70%" stop-color="#FAF8F1" />
      <stop offset="100%" stop-color="#E3ECE7" />
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2B8A78" />
      <stop offset="100%" stop-color="#1B4C3A" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2CE" />
      <stop offset="100%" stop-color="#DFC078" />
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="800" height="600" fill="url(#skyGrad)" />

  <!-- Warm Morning Sun Behind Village Tree -->
  <circle cx="580" cy="220" r="110" fill="url(#sunGrad)" opacity="0.65" />

  <!-- Distant Rural Landscape & Fields -->
  <path d="M0 420 Q200 390 450 420 T800 400 L800 600 L0 600 Z" fill="#D2E4DC" />
  <path d="M0 450 Q320 420 580 460 T800 440 L800 600 L0 600 Z" fill="#9FC2B3" />

  <!-- Main Community Ground Foreground -->
  <path d="M0 480 Q250 460 520 485 T800 470 L800 600 L0 600 Z" fill="url(#groundGrad)" />

  <!-- Banyan / Peepal Community Tree (Symbol of Grassroots Gathering) -->
  <g transform="translate(560, 160)">
    <!-- Tree Trunk -->
    <path d="M50 330 C45 260 25 210 10 160 C-5 110 -20 60 -10 20 C10 60 25 110 35 160 C55 120 70 80 85 30 C90 80 80 140 70 200 C85 240 95 280 110 330 Z" fill="#173F30" />
    <!-- Canopy Clusters -->
    <circle cx="30" cy="40" r="75" fill="#205C46" opacity="0.9" />
    <circle cx="-25" cy="70" r="65" fill="#267156" opacity="0.85" />
    <circle cx="95" cy="50" r="70" fill="#2B8A78" opacity="0.85" />
    <circle cx="40" cy="-20" r="85" fill="#1D4E3C" opacity="0.95" />
    <circle cx="110" cy="-10" r="60" fill="#267156" opacity="0.8" />
  </g>

  <!-- Community Center / Welfare Canopy Structure -->
  <g transform="translate(120, 310)">
    <!-- Tent / Pavilion Roof -->
    <polygon points="180,40 30,120 330,120" fill="#C59635" opacity="0.9" />
    <polygon points="180,40 180,120 330,120" fill="#9E7422" opacity="0.4" />
    <!-- Pillars -->
    <rect x="50" y="120" width="8" height="110" fill="#173F30" />
    <rect x="176" y="120" width="8" height="110" fill="#173F30" />
    <rect x="302" y="120" width="8" height="110" fill="#173F30" />
    <!-- Banner on Pavilion -->
    <rect x="65" y="130" width="230" height="32" rx="4" fill="#FAF8F1" stroke="#205C46" stroke-width="1.5" />
    <text x="180" y="151" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#205C46" letter-spacing="0.5">LAKSHYA WELFARE CAMP</text>
  </g>

  <!-- Stylized Community Members (Doctor / Founder, Volunteers, Villagers, Children) -->
  <!-- Figure 1: Doctor / Facilitator with Health Kit -->
  <g transform="translate(230, 390)">
    <circle cx="20" cy="20" r="14" fill="#E6BA95" /> <!-- Head -->
    <path d="M6 38 Q20 34 34 38 L38 95 L2 95 Z" fill="#FAF8F1" /> <!-- White Apron / Coat -->
    <path d="M14 44 L20 54 L26 44" stroke="#205C46" stroke-width="3" fill="none" /> <!-- Stethoscope motif -->
    <rect x="32" y="58" width="16" height="14" rx="2" fill="#B92525" /> <!-- Medical First Aid Kit -->
    <rect x="38" y="62" width="4" height="6" fill="#FFFFFF" />
    <rect x="37" y="63" width="6" height="4" fill="#FFFFFF" />
  </g>

  <!-- Figure 2: Community Elder seated / in discussion -->
  <g transform="translate(160, 410)">
    <circle cx="16" cy="18" r="12" fill="#DCA882" />
    <path d="M4 34 Q16 30 28 34 L32 85 L0 85 Z" fill="#DFD2C0" />
  </g>

  <!-- Figure 3: Rural Mother & Child holding book -->
  <g transform="translate(320, 400)">
    <!-- Mother -->
    <circle cx="18" cy="18" r="13" fill="#D8A07A" />
    <path d="M5 34 Q18 30 31 34 L36 90 L0 90 Z" fill="#2B8A78" />
    <!-- Child -->
    <circle cx="48" cy="40" r="10" fill="#D8A07A" />
    <path d="M38 52 Q48 50 58 52 L60 85 L36 85 Z" fill="#C59635" />
    <!-- Book in Child's hands -->
    <rect x="42" y="58" width="16" height="12" rx="1" fill="#FFFFFF" stroke="#173F30" stroke-width="1" />
  </g>

  <!-- Figure 4: Young Student running towards camp with school bag -->
  <g transform="translate(430, 415)">
    <circle cx="16" cy="16" r="11" fill="#DCA882" />
    <path d="M6 30 Q16 28 26 30 L29 75 L3 75 Z" fill="#205C46" />
    <rect x="4" y="32" width="12" height="16" rx="2" fill="#9E7422" /> <!-- Bag -->
  </g>

  <!-- Editorial Card Floating Overlay at Bottom Left -->
  <g transform="translate(40, 470)">
    <rect width="360" height="85" rx="12" fill="#FFFFFF" stroke="#DFD9CC" stroke-width="1.5" filter="drop-shadow(0 6px 16px rgba(0,0,0,0.12))" />
    <circle cx="42" cy="42" r="22" fill="#E3F1EC" />
    <!-- Heart & Hands Icon -->
    <path d="M36 42 Q42 36 48 42 Q42 50 36 42 Z" fill="#205C46" />
    <text x="76" y="36" font-family="'Lora', Georgia, serif" font-size="14" font-weight="700" fill="#123326">Rooted in Pilibhit, Uttar Pradesh</text>
    <text x="76" y="54" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#53635D">Serving rural families in Chandoi with dignity & care</text>
    <text x="76" y="68" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#C59635" letter-spacing="0.5">ESTABLISHED COMMUNITY WELFARE</text>
  </g>
</svg>
