<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgHealth" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8F4F0" />
      <stop offset="100%" stop-color="#FAF8F1" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgHealth)" />

  <!-- Medical Camp Desk & Canopy Setup -->
  <rect x="0" y="320" width="600" height="130" fill="#205C46" opacity="0.1" />

  <!-- Medical Cross / Shield Emblem Backdrop -->
  <g transform="translate(300, 150)">
    <circle cx="0" cy="0" r="85" fill="#FFFFFF" stroke="#2B8A78" stroke-width="2" />
    <path d="M-15 -45 H15 V-15 H45 V15 H15 V45 H-15 V15 H-45 V-15 H-15 Z" fill="#205C46" />
    <circle cx="0" cy="0" r="10" fill="#C59635" />
  </g>

  <!-- Health Camp Consultation Desk -->
  <g transform="translate(140, 240)">
    <!-- Consultation Table -->
    <rect x="20" y="70" width="280" height="70" rx="6" fill="#FFFFFF" stroke="#205C46" stroke-width="2" />
    <line x1="40" y1="90" x2="160" y2="90" stroke="#DFD9CC" stroke-width="2" />
    <line x1="40" y1="105" x2="140" y2="105" stroke="#DFD9CC" stroke-width="2" />
    
    <!-- Blood Pressure Monitor / Medical Instruments on Desk -->
    <rect x="180" y="55" width="45" height="35" rx="4" fill="#2B8A78" />
    <circle cx="202" cy="72" r="10" fill="#FFFFFF" />
    <path d="M225 72 C240 72 245 85 260 85" stroke="#153E2F" stroke-width="3" fill="none" />
    
    <!-- Medicine Kit / Health Register -->
    <rect x="40" y="52" width="50" height="30" rx="3" fill="#C59635" />
    <text x="65" y="72" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Rx</text>
  </g>

  <!-- Doctor & Elder Silhouette -->
  <g transform="translate(100, 190)">
    <!-- Doctor Head & Torso -->
    <circle cx="90" cy="40" r="18" fill="#E6BA95" />
    <path d="M70 65 Q90 60 110 65 L115 130 L65 130 Z" fill="#FFFFFF" stroke="#DFD9CC" stroke-width="1.5" />
    <!-- Stethoscope -->
    <path d="M82 72 C80 88 100 88 98 72" stroke="#205C46" stroke-width="3" fill="none" />
  </g>

  <g transform="translate(360, 200)">
    <!-- Patient seated -->
    <circle cx="30" cy="40" r="17" fill="#D8A07A" />
    <path d="M12 65 Q30 60 48 65 L52 130 L8 130 Z" fill="#2B8A78" />
  </g>

  <!-- Tag -->
  <rect x="25" y="25" width="220" height="34" rx="17" fill="#FFFFFF" stroke="#2B8A78" stroke-width="1.5" />
  <circle cx="42" cy="42" r="7" fill="#2B8A78" />
  <text x="58" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#205C46" letter-spacing="0.5">HEALTH SCREENING CAMP</text>

  <!-- Bottom Caption -->
  <rect x="25" y="385" width="550" height="42" rx="8" fill="#FFFFFF" stroke="#DFD9CC" stroke-width="1" />
  <text x="45" y="411" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#123326">Free Community Health Check-up & Awareness • Pilibhit District</text>
</svg>
