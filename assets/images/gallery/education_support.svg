<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bgEdu" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#E9F2EE" />
    </linearGradient>
  </defs>
  <rect width="600" height="450" fill="url(#bgEdu)" />

  <!-- Classroom / Open Air Learning Chalkboard Backdrop -->
  <rect x="75" y="70" width="450" height="230" rx="12" fill="#1C382D" stroke="#C59635" stroke-width="3" />
  
  <!-- Chalkboard Notes -->
  <text x="120" y="125" font-family="'Lora', Georgia, serif" font-size="20" font-weight="600" fill="#E8F1EC">हर बच्चा पढ़े, हर बच्चा बढ़े</text>
  <text x="120" y="155" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="500" fill="#A3C7B7">Lakshya Rural Learning Support Drive</text>
  <path d="M120 170 H420" stroke="#4AA493" stroke-width="1.5" stroke-dasharray="4 4" />
  
  <!-- Chalk Math / Literacy Symbols -->
  <text x="120" y="220" font-family="'Lora', serif" font-size="28" font-weight="700" fill="#DFC078">A B C</text>
  <text x="230" y="220" font-family="'Lora', serif" font-size="28" font-weight="700" fill="#FFFFFF">1 2 3</text>
  <text x="340" y="220" font-family="'Lora', serif" font-size="28" font-weight="700" fill="#DFC078">अ आ इ</text>

  <!-- Educational Kit Stack in Foreground -->
  <g transform="translate(180, 270)">
    <!-- Stack of Books & Notebooks -->
    <rect x="40" y="50" width="160" height="22" rx="4" fill="#C59635" />
    <rect x="35" y="32" width="170" height="20" rx="4" fill="#2B8A78" />
    <rect x="45" y="14" width="150" height="20" rx="4" fill="#205C46" />
    <rect x="50" y="-2" width="140" height="18" rx="4" fill="#FAF8F1" stroke="#DFD9CC" stroke-width="1" />
    
    <!-- Pencil / Pen holder -->
    <rect x="230" y="10" width="45" height="65" rx="6" fill="#153E2F" />
    <line x1="240" y1="10" x2="235" y2="-18" stroke="#C59635" stroke-width="5" stroke-linecap="round" />
    <line x1="252" y1="10" x2="252" y2="-24" stroke="#4AA493" stroke-width="5" stroke-linecap="round" />
    <line x1="264" y1="10" x2="268" y2="-16" stroke="#FAF8F1" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Category Tag -->
  <rect x="25" y="25" width="200" height="34" rx="17" fill="#FFFFFF" stroke="#C59635" stroke-width="1.5" />
  <circle cx="42" cy="42" r="7" fill="#C59635" />
  <text x="58" y="46" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#784A04" letter-spacing="0.5">CHILD EDUCATION</text>

  <!-- Bottom Caption -->
  <rect x="25" y="385" width="550" height="42" rx="8" fill="#FFFFFF" stroke="#DFD9CC" stroke-width="1" />
  <text x="45" y="411" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#123326">Educational Kits & Notebook Distribution • Chandoi School Support</text>
</svg>
